version: 2

models:
  - name: dim_customer
    description: >
      Customer-level dimension combining CRM information
      with aggregated booking history. One row per customer.

      Repeat customers have completed at least two bookings.
      Lifetime revenue represents realized revenue in the
      available booking history.

    columns:
      - name: customer_id
        description: "Unique customer identifier."
        data_tests:
          - unique
          - not_null

      - name: acquisition_channel
        description: "Original customer acquisition channel."
        data_tests:
          - not_null

      - name: total_bookings
        description: "Total reservations across all statuses."
        data_tests:
          - not_null

      - name: completed_bookings
        description: "Number of completed reservations."
        data_tests:
          - not_null

      - name: lifetime_revenue
        description: "Total realized revenue in available booking history."
        data_tests:
          - not_null

      - name: customer_lifecycle_stage
        description: "Customer classification based on completed bookings."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Prospect
                  - First-Time Customer
                  - Repeat Customer