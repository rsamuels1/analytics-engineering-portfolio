version: 2

models:
  - name: dim_campaign
    description: >
      Campaign dimension containing one row per advertising campaign.

    columns:
      - name: campaign_id
        description: "Unique identifier for the advertising campaign."
        data_tests:
          - not_null
          - unique

      - name: campaign_name
        description: "Human-readable campaign name."
        data_tests:
          - not_null

      - name: channel
        description: "Advertising channel associated with the campaign."
        data_tests:
          - not_null

      - name: campaign_type
        description: "Advertising campaign type."
        data_tests:
          - not_null
